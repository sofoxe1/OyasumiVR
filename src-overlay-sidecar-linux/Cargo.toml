[package]
name = "src-overlay-sidecar-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
log = { version = "0.4.28", features = ["release_max_level_info"] }
tokio = { version = "1.48.0", default-features = false, features = ["rt", "rt-multi-thread"] }
tonic = { version = "0.14.2"}
prost = "0.14"
tonic-prost = "*"
tonic-web = "0.14.2"
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6", default-features = false, features = ["cors", "fs"] }
rand = { version = "0.9.2", default-features = false }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tokio-tungstenite = "0.28.0"
futures-util = { version = "0.3.31", default-features = false }
base64 = "0.22.1"
xr_overlay = { git = "https://codeberg.org/sofoxe1/xr_overlay", version = "0.1.0",rev="c102dac58dd568976d69ada3804f06b2f50c31c7",features = ["binding_config","action_last_input","graphics_shaders","apprunner_input"],default-features = false }
# xr_overlay = { path="../../xr_overlay/core/" }
xr_overlay_cef = { git = "https://codeberg.org/sofoxe1/xr_overlay", version = "0.1.0",rev="c102dac58dd568976d69ada3804f06b2f50c31c7" }
hyper = "1.8.1"
axum = { version = "0.8.7", features = ["http1", "http2", "tokio"], default-features = false }
portpicker = "0.1.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
oyasumi_shared = { version = "0.1.0", path = "../src-shared-rust" }
toml = "0.9.11"
chrono = "0.4.44"
# xr_overlay_cef = {  path="../../xr_overlay/cef_app/" }
[build-dependencies]
tonic-prost-build = "*"
[profile.release]
codegen-units = 64
debug = true
debug-assertions = true
[profile.production]
debug-assertions = false
strip=true
debug=false
inherits = "release"
panic = "abort"
codegen-units = 1
lto = true

[profile.dev]
opt-level = 1

[package.metadata.multivers.x86_64]
cpus = ["x86-64-v3", "x86-64-v4"]

